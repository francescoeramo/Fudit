name: Update flyer prices

on:
  schedule:
    - cron: "15 5 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-flyer-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install free PDF OCR tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-ita
      - name: Read public flyers
        run: node scripts/update-flyer-prices.mjs
      - name: Verify generated data and app
        run: npm test -- src/lib/flyer-prices.test.ts && npm run build
      - name: Commit updated prices
        run: |
          if git diff --quiet -- public/flyer-prices.json; then
            echo "No flyer changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/flyer-prices.json
          git commit -m "Update weekly flyer prices"
          git push origin HEAD:main
